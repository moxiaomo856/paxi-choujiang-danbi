<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<!-- =====================================================================
     全局脚本错误兜底（必须最先执行）
     ===================================================================== -->
<script>
(function () {
  function show(text) {
    var b = document.getElementById('banner');
    if (b) { b.hidden = false; b.className = 'banner err'; b.textContent = text; }
    var lg = document.getElementById('log');
    if (lg) lg.textContent = '[' + new Date().toLocaleTimeString() + '] ' + text + '\n' + lg.textContent;
  }
  function later(text) {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function () { show(text); });
    } else { show(text); }
  }
  window.addEventListener('error', function (ev) {
    var m = (ev && (ev.message || (ev.error && ev.error.message))) || '';
    var f = (ev && ev.filename) ? String(ev.filename).split('/').pop() : '';
    var line = ev && ev.lineno ? ':' + ev.lineno : '';
    var text = m
      ? '⚠️ 脚本错误：' + m + (f ? '（' + f + line + '）' : '')
      : '⚠️ 资源加载失败：' + ((ev && ev.target && (ev.target.src || ev.target.href)) || '未知');
    window.__lastError = text;
    later(text);
  }, true);
  window.addEventListener('unhandledrejection', function (ev) {
    var r = ev && ev.reason;
    window.__lastError = (r && r.message) || String(r);
  });
})();
</script>
<meta name="theme-color" content="#0f1115" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Paxi 抽奖" />
<title>Paxi 抽奖</title>
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon-192.png" type="image/png" sizes="192x192" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app">

  <!-- ========== 顶栏 ========== -->
  <header class="topbar">
    <div class="brand"><img class="brand-ic" src="./icon-128.png" alt="" width="24" height="24" decoding="async" /><span>Paxi 抽奖</span></div>
    <div class="wallet">
      <button id="btnConnect" class="btn primary sm" data-i18n="wallet.connect">连接</button>
      <button id="btnSession" class="btn ghost sm" hidden data-i18n="wallet.openSession">开无感</button>
      <button id="btnLang" class="btn ghost sm lang-btn">EN</button>
      <span id="sessTag" class="tag" hidden data-i18n="wallet.sessionTag">无感</span>
      <a id="btnHome" class="btn ghost sm home-btn" href="../" title="返回门户 / Hub" style="text-decoration:none"><span class="home-ic">🏛️</span><span class="home-tx" data-i18n="wallet.home">门户</span></a>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>
  <div id="toastWrap" class="toast-wrap"></div>

  <main class="pages">

    <!-- ========== 奖池 ========== -->
    <section class="page" id="page-pools">
      <div id="claimsTop" class="claims-top" hidden>
        <div class="claims-title">
          <span data-i18n="pools.claimsTitle">🎁 待领奖</span><i class="claims-count" id="claimsCount"></i>
        </div>
        <div id="claimsTopList" class="list"></div>
      </div>

      <div id="sessionCard" class="session-card" hidden>
        <div class="session-card-icon">💡</div>
        <div class="session-card-body">
          <div class="session-card-title" id="sessionCardTitle"></div>
          <div class="session-card-desc" id="sessionCardDesc"></div>
        </div>
        <button id="btnSessionCard" class="btn primary sm"></button>
      </div>

      <div class="rowbar">
        <select id="fStatus" class="inp">
          <option value="" data-i18n="pools.filter.ongoing">进行中</option>
          <option value="all" data-i18n="pools.filter.all">全部（含已结束）</option>
          <option value="open" data-i18n="pools.filter.open">报名中</option>
          <option value="full" data-i18n="pools.filter.full">已满员</option>
          <option value="drawn" data-i18n="pools.filter.drawn">已开奖</option>
          <option value="expired" data-i18n="pools.filter.expired">已过期</option>
        </select>
        <button id="btnRefresh" class="btn sm" data-i18n="common.refresh">刷新</button>
      </div>
      <div id="list" class="list"></div>
    </section>

    <!-- ========== 创建 ========== -->
    <section class="page" id="page-create" hidden>
      <h2 class="page-title" data-i18n="create.title">建池参数</h2>

      <label class="meta" data-i18n="create.people">人数上限</label>
      <input id="inpPeople" class="inp block" type="number" min="5" max="200" step="1" value="20"
             data-i18n-placeholder="create.peoplePh" placeholder="5 ~ 200" enterkeyhint="done" />

      <label class="meta" id="lblJoin" data-i18n="create.joinAmount">每份参与费（PAXI）</label>
      <input id="inpJoin" class="inp block" type="number" min="0" step="any"
             data-i18n-placeholder="create.joinAmountPh" placeholder="5 ~ 150000" enterkeyhint="done" />

      <div class="cost-box" id="costBox">
        <div class="cost-row"><span data-i18n="create.fee">建池费（upaxi）</span><b id="costCreate">—</b></div>
        <div class="cost-row"><span data-i18n="create.estPool">满员总奖池</span><b id="costPool">—</b></div>
        <div class="cost-row"><span data-i18n="create.estFirst">预计一等奖</span><b id="costFirst">—</b></div>
      </div>

      <button id="btnCreate" class="btn primary block" data-i18n="create.btn">建池并支付建池费</button>
      <p class="hint" style="text-align:center;margin-top:14px" data-i18n="create.hint">
        建池费全额进入奖池并转运营；满员后任何人可触发开奖。
      </p>
    </section>

    <!-- ========== 我的 ========== -->
    <section class="page" id="page-me" hidden>
      <h2 class="page-title" data-i18n="me.title">钱包</h2>

      <!-- 1. 充值 / 提现（置顶，最显眼） -->
      <div class="dep-card">
        <div class="row wrap">
          <input id="depAmount" class="inp" type="number" min="0" step="0.000001"
                 data-i18n-placeholder="me.amount" placeholder="数量" enterkeyhint="done" />
          <select id="depToken" class="inp">
            <option value="token" id="depOptToken"></option>
            <option value="paxi" id="depOptPaxi">PAXI</option>
          </select>
          <button id="btnDeposit" class="btn" data-i18n="me.deposit">充值</button>
          <button id="btnWithdraw" class="btn ghost" data-i18n="me.withdraw">提现</button>
        </div>
        <p class="hint" data-i18n="me.depositHint">充值进合约内部余额后，建池 / 参与 / 领取才能扣款；提现会回到链上钱包地址。</p>
      </div>

      <!-- 2. 余额：内部 | 链上，一行两列 -->
      <div class="bal-grid wb">
        <div class="bal">
          <div class="k head" data-i18n="me.intBalTitle">💰 合约内部余额</div>
          <div class="k" id="balIntLabel">内部 PAXI</div>
          <div class="v" id="balInt">0</div>
          <div id="balIntPaxiBox">
            <div class="k" data-i18n="me.intBalPaxi">内部 PAXI</div>
            <div class="v" id="balIntPaxi">0</div>
          </div>
        </div>
        <div class="bal">
          <div class="k head" data-i18n="me.walletTitle">👛 链上钱包</div>
          <div class="k" id="balTokLabel">链上 PAXI</div>
          <div class="v" id="balTok">0</div>
          <div id="balPaxiBox">
            <div class="k" data-i18n="me.paxiBal">链上 PAXI</div>
            <div class="v" id="balPaxi">0</div>
          </div>
        </div>
      </div>

      <!-- 3. 我的地址 -->
      <div class="bal addr-card">
        <div class="k" data-i18n="me.balAddr">我的地址</div>
        <div class="v addr" id="balAddr">—</div>
      </div>

      <div class="sess-row" id="sessRow">
        <div class="sess-info">
          <div class="k" data-i18n="sessStatus.label">无感会话</div>
          <div class="v off" id="sessStateText"></div>
          <div class="hint" id="sessGasText"></div>
        </div>
        <button id="btnSessionMe" class="btn sm"></button>
      </div>

      <details class="collapse me-sec" id="secClaims">
        <summary data-i18n="me.claims">🎁 待领奖</summary>
        <div id="myClaims" class="list"></div>
      </details>

      <details class="collapse me-sec" id="secCreated">
        <summary data-i18n="me.created">🏗️ 我建的池</summary>
        <div id="myCreated" class="list"></div>
      </details>

      <details class="collapse me-sec" id="secJoined">
        <summary data-i18n="me.joined">🎯 我参与的池</summary>
        <div id="myJoined" class="list"></div>
      </details>
    </section>

    <!-- ========== 管理（仅管理员可见） ========== -->
    <section class="page" id="page-admin" hidden>
      <h2 class="page-title" data-i18n="admin.title">管理员操作</h2>
      <p class="hint" data-i18n="admin.onlyAdmin">仅管理员地址可见本页</p>
      <p class="hint" id="adminsStatus"></p>
      <p class="hint" id="treasuryStatus"></p>
      <p class="hint" id="configStatus"></p>

      <div id="pauseBox" class="row wrap">
        <button id="btnPause" class="btn" data-i18n="admin.pause">暂停合约</button>
        <button id="btnResume" class="btn" data-i18n="admin.resume">恢复合约</button>
      </div>

      <h2 class="page-title" data-i18n="admin.opsConfig">运营配置</h2>
      <div class="row wrap">
        <input id="inpTreasury" class="inp" style="flex:1;min-width:220px"
               data-i18n-placeholder="admin.setTreasury" autocomplete="off" spellcheck="false"
               placeholder="运营金库地址" />
        <button id="btnSetTreasury" class="btn" data-i18n="admin.setTreasuryBtn">写入</button>
      </div>
      <div class="row wrap">
        <input id="inpFee" class="inp" type="number" min="1" max="50" step="1" style="flex:1;min-width:120px"
               data-i18n-placeholder="admin.setFee" placeholder="建池费（upaxi）" enterkeyhint="done" />
        <button id="btnSetFee" class="btn" data-i18n="admin.setFeeBtn">写入</button>
      </div>
      <div class="row wrap">
        <input id="inpTimeout" class="inp" type="number" min="1" step="1" style="flex:1;min-width:120px"
               data-i18n-placeholder="admin.cancelTimeout" placeholder="超时秒数" enterkeyhint="done" />
        <button id="btnSetTimeout" class="btn" data-i18n="admin.setTimeoutBtn">写入</button>
      </div>

      <details class="collapse">
        <summary data-i18n="admin.burnMode">销毁方式（非 PAXI 的 6%）</summary>
        <select id="burnMode" class="inp block">
          <option value="0" data-i18n="admin.burn0">0 · 转运营</option>
          <option value="1" data-i18n="admin.burn1">1 · 销毁</option>
          <option value="2" data-i18n="admin.burn2">2 · 黑洞</option>
        </select>
        <div class="row wrap">
          <input id="inpBurnAddr" class="inp" style="flex:1;min-width:220px"
                 data-i18n-placeholder="admin.burnAddr" autocomplete="off" spellcheck="false"
                 placeholder="黑洞地址（仅模式 2 / Native 销毁需要）" />
          <button id="btnApplyBurn" class="btn" data-i18n="admin.applyBurnMode">应用销毁方式</button>
        </div>
        <p class="hint" id="burnHint"></p>
      </details>

      <details class="collapse">
        <summary data-i18n="admin.adminList">管理员</summary>
        <div id="adminListBox" class="meta"></div>
        <div class="row wrap">
          <input id="inpAddAdmin" class="inp" style="flex:1;min-width:220px"
                 data-i18n-placeholder="admin.addAdmin" autocomplete="off" spellcheck="false"
                 placeholder="新增管理员地址" />
          <button id="btnAddAdmin" class="btn" data-i18n="admin.updateAdminBtn">更新</button>
        </div>
        <div class="row wrap">
          <input id="inpRmAdmin" class="inp" style="flex:1;min-width:220px"
                 data-i18n-placeholder="admin.removeAdmin" autocomplete="off" spellcheck="false"
                 placeholder="移除管理员地址" />
          <button id="btnRmAdmin" class="btn ghost" data-i18n="admin.updateAdminBtn">更新</button>
        </div>
      </details>
    </section>

  </main>

  <nav class="tabbar">
    <button class="tab active" data-tab="pools">
      <span class="ico">🎰</span><span data-i18n="nav.tabPools">奖池</span>
    </button>
    <button class="tab" data-tab="create">
      <span class="ico">✨</span><span data-i18n="nav.tabCreate">创建</span>
    </button>
    <button class="tab" data-tab="me">
      <span class="ico">💰</span><span data-i18n="nav.tabMe">钱包</span><i class="dot" id="tabMeDot" hidden></i>
    </button>
    <button class="tab" data-tab="admin" id="tabAdmin" hidden>
      <span class="ico">⚙️</span><span data-i18n="nav.tabAdmin">管理</span>
    </button>
  </nav>

  <pre id="log" class="log"></pre>
</div>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>

<!-- =====================================================================
     交易 / 加密库加载器：本地 vendor 优先 + CDN 兜底
     ===================================================================== -->
<script type="importmap">
{
  "imports": {
    "@noble/hashes/crypto": "./vendor/hashes/crypto.js",
    "@noble/hashes/utils": "./vendor/hashes/utils.js"
  }
}
</script>
<script type="module">
  const errs = [];
  async function importAny(label, urls) {
    for (const u of urls) {
      try { return await import(u); } catch (e) { errs.push(label + ' ← ' + u + ' : ' + (e && e.message)); }
    }
    throw new Error(label + ': all sources failed');
  }
  try {
    window.nobleSecp256k1 = await importAny('secp256k1', [
      './vendor/secp256k1.mjs',
      'https://cdn.jsdelivr.net/npm/@noble/secp256k1@2.1.0/index.min.js',
      'https://esm.sh/@noble/secp256k1@2.1.0',
    ]);
  } catch (e) { errs.push(e.message); }
  try {
    const [s, r] = await Promise.all([
      importAny('hashes/sha256', [
        './vendor/hashes/sha256.js',
        'https://cdn.jsdelivr.net/npm/@noble/hashes@1.4.0/esm/sha256.js',
        'https://esm.sh/@noble/hashes@1.4.0/sha256',
      ]),
      importAny('hashes/ripemd160', [
        './vendor/hashes/ripemd160.js',
        'https://cdn.jsdelivr.net/npm/@noble/hashes@1.4.0/esm/ripemd160.js',
        'https://esm.sh/@noble/hashes@1.4.0/ripemd160',
      ]),
    ]);
    window.nobleHashes = { sha256: s.sha256, ripemd160: r.ripemd160 };
  } catch (e) { errs.push(e.message); }
  try {
    const m = await importAny('bech32', ['./vendor/bech32.mjs', 'https://esm.sh/bech32@2.0.0']);
    window.bech32 = m.bech32 || (m.default && m.default.bech32) || m.default;
  } catch (e) { errs.push(e.message); }
  window.__cryptoErrors = errs;
  window.dispatchEvent(new Event('crypto-ready'));
</script>

<script>
  function loadScript(src) {
    return new Promise((resolve) => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = () => resolve(true);
      s.onerror = () => resolve(false);
      document.head.appendChild(s);
    });
  }
  (async () => {
    if (typeof Long === 'undefined') await loadScript('./vendor/long.umd.js');
    if (typeof Long === 'undefined') await loadScript('https://cdn.jsdelivr.net/npm/long@5.2.3/umd/index.js');
    let ok = await loadScript('./vendor/paxi-cosmjs.umd.js');
    if (ok && typeof PaxiCosmJS === 'undefined') ok = false;
    if (!ok) ok = await loadScript('https://mainnet-api.paxinet.io/resources/js/paxi-cosmjs.umd.js');
    window.__cosmjsReady = !!(ok && typeof PaxiCosmJS !== 'undefined');
    window.dispatchEvent(new Event('cosmjs-ready'));
  })();
</script>

<!-- 站点名称 / 主色来自 config.js，页面本身无需按站修改 -->
<script src="hash.js"></script>
<script src="config.js"></script>
<script>
  (function () {
    var C = window.CJ_CONFIG || {};
    if (C.appTitle) {
      document.title = C.appTitle;
      var brand = document.querySelector('.topbar .brand');
      if (brand) {
        brand.innerHTML = '<img class="brand-ic" src="./icon-128.png" alt="" width="24" height="24" decoding="async" />';
        var bt = document.createElement('span');
        bt.textContent = C.appTitle;
        brand.appendChild(bt);
      }
      var meta = document.querySelector('meta[name="apple-mobile-web-app-title"]');
      if (meta) meta.setAttribute('content', C.appTitle);
    }
    if (C.accent) { document.documentElement.style.setProperty('--pri', C.accent); document.documentElement.style.setProperty('--pri2', C.accent2 || C.accent); }
  })();
</script>
<script src="i18n.js"></script>
<script src="chain.js"></script>
<script src="session.js"></script>
<script src="lottery.js"></script>
<script src="app.js"></script>
</body>
</html>
